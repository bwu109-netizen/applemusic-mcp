[project]
name = "applemusic-mcp"
version = "0.1.0"
description = "MCP server that lets Claude (or any MCP client) control and analyze the macOS Music app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]
keywords = ["mcp", "apple-music", "macos", "claude", "jxa", "applescript"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.urls]
Homepage = "https://github.com/bwu109-netizen/applemusic-mcp"
Issues = "https://github.com/bwu109-netizen/applemusic-mcp/issues"

[project.scripts]
applemusic-mcp = "applemusic_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applemusic_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
