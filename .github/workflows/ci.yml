name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tests mock the Music app, so they run on Linux. `node --check` validates
    # the generated JXA scripts' syntax.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q
